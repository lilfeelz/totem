CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=60000

CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# BT_CTLR_ASSERT_OVERHEAD_START sits behind Zephyr's hidden "Advanced
# features" Kconfig menu. Without ADVANCED_FEATURES also set, the =n
# below gets silently discarded (default y wins). Default y means a late
# BLE radio event prepare asserts instead of skipping, which k_oops's the
# central half outright - macOS's pairing/negotiation traffic triggers the
# late-prepare condition; iPhone and USB don't. zmkfirmware/zmk#3331.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n

# Slices ~85ms nRF52 flash page-erase stalls into smaller radio-schedulable
# chunks, so NVS/bond writes are less likely to delay a BLE radio event.
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
