CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Temporary: USB console logging to debug the BT_SEL profile-switch hang.
# Remove once resolved.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
# Synchronous logging: the deferred/buffered default can lose the last
# messages right before a hang, which is exactly what we need to see here.
CONFIG_LOG_MODE_IMMEDIATE=y
